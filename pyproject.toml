[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-translation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for cross-language spoken audio capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Documentation claim auditor contributors"}]
dependencies = []

[project.scripts]
speech-translation-claim-audit = "speech_translation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["speech_translation_claim_audit*"]
